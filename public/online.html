<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Users</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="styles.css">
    <style>
        .navbar {
            background: linear-gradient(45deg, #ff6b6b, #f3a683, #ff9ff3, #feca57, #1dd1a1, #54a0ff, #5f27cd, #c8d6e5);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .navbar-brand, .nav-link {
            color: white !important;
        }

        .navbar-brand:hover, .nav-link:hover {
            color: #ffeaa7 !important;
        }

        .user-card {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 5px;
            width: 100%;
            text-align: center;
            overflow: auto;
            background: linear-gradient(45deg, #ff6b6b, #f3a683, #ff9ff3, #feca57, #1dd1a1, #54a0ff, #5f27cd, #c8d6e5);
            background-size: 400% 400%;
            animation: glow 6s ease infinite alternate;
        }

        @keyframes glow {
            from {
                border-color: #000;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }
            to {
                border-color: #fff;
                box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            }
        }

        .user-card img {
            max-width: 100%;
            border-radius: 10px;
            margin-right: 10px;
        }

        .user-info {
            flex-grow: 1;
        }

        .user-info h4 {
            margin-left: 3px;
            margin-bottom: 3px;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: start;
            color: white;
        }

        .user-info p {
            margin: 0;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: start;
            color: white;
        }

        .alert {
            margin: 20px;
        }

        .online-container {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }

        .online-label {
            margin-right: 10px;
            font-size: 20px;
            font-weight: 500;
        }

        #user_online {
            font-size: 20px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <a class="navbar-brand" href="#">Active</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item active">
                    <a class="nav-link" href="#">Active <span class="sr-only">(current)</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">Features</a>
                    <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                        <a class="dropdown-item" href="/step_by_step_guide">Step-by-Step Guide</a>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="row online-container">
            <div class="online-label">Current Online:</div>
            <div id="user_online">
                0
            </div>
        </div>
        <div id="user_list" class="row"></div>
    </div>

    <script>
        async function fetchOnlineUserCount() {
            try {
                const response = await fetch('/info');
                const data = await response.json();
                return data; // Adjust based on the actual response structure
            } catch (error) {
                console.error('Error fetching user count:', error);
                return [];
            }
        }

        async function updateOnlineUserCount() {
            const userOnlineElement = document.getElementById('user_online');
            const users = await fetchOnlineUserCount();
            userOnlineElement.textContent = users.length; // Update total online user count
        }

        async function listOfAi() {
            const userOnline = document.getElementById("user_list");
            try {
                const response = await fetch("/info");
                const data = await response.json();
                userOnline.innerHTML = ''; // Clear existing content
                data.forEach(user => {
                    const { name, thumbSrc, profileUrl, time } = user;
                    const userCard = document.createElement('div');
                    userCard.className = 'col-12 user-card mb-4';
                    const image = document.createElement('img');
                    image.src = thumbSrc;
                    image.alt = 'User Thumbnail';
                    const userInfo = document.createElement('div');
                    userInfo.className = 'user-info';
                    const userName = document.createElement('h4');
                    userName.textContent = "HIDDEN 🖤";
                    const profileLink = document.createElement('p');
                     //profileLink.innerHTML = `${profileUrl}`;
                    const uptimeUser = document.createElement('p');
                    uptimeUser.className = 'uptime-user';
                    uptimeUser.innerHTML = `Uptime: ${timeFormat(time)}`;
                    userInfo.appendChild(userName);
                    userInfo.appendChild(profileLink);
                    userInfo.appendChild(uptimeUser);
                    userCard.appendChild(image);
                    userCard.appendChild(userInfo);
                    userOnline.appendChild(userCard);

                    // Update timer for user
                    setInterval(() => {
                        user.time++;
                        updateTimer(userCard, user.time);
                    }, 1000);
                });
            } catch (error) {
                console.error(error);
                userOnline.innerHTML = `<div class="alert alert-danger" role="alert">An error occurred while fetching data.</div>`;
            }
        }

        function updateTimer(userCard, currentTime) {
            const uptimeUser = userCard.querySelector('.uptime-user');
            uptimeUser.textContent = `Uptime ✅ : ${timeFormat(currentTime)}`;
        }

        function timeFormat(currentTime) {
            const days = Math.floor(currentTime / (3600 * 24));
            const hours = Math.floor((currentTime % (3600 * 24)) / 3600);
            const minutes = Math.floor((currentTime % 3600) / 60);
            const seconds = currentTime % 60;
            let timeFormat = '';
            if (days > 0) timeFormat += `${days} day${days > 1 ? 's' : ''} `;
            if (hours > 0) timeFormat += `${hours} hour${hours > 1 ? 's' : ''} `;
            if (minutes > 0) timeFormat += `${minutes} minute${minutes > 1 ? 's' : ''} `;
            timeFormat += `${seconds} second${seconds > 1 ? 's' : ''}`;

            return timeFormat.trim();
        }

        async function init() {
            await updateOnlineUserCount();
            listOfAi();
            setInterval(updateOnlineUserCount, 1000); // Update online count every 10 seconds
        }

        // Initialize
        init();
    </script>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
</body>
</html>
