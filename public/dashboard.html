
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Priyansh Multi-Bot Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .sidebar {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            min-height: 100vh;
            padding: 20px 0;
        }
        .main-content {
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
        }
        .bot-card {
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }
        .bot-card:hover {
            transform: translateY(-5px);
        }
        .status-running {
            color: #28a745;
        }
        .status-stopped {
            color: #dc3545;
        }
        .status-error {
            color: #ffc107;
        }
        .nav-link {
            color: rgba(255, 255, 255, 0.8) !important;
            border-radius: 10px;
            margin: 5px 0;
        }
        .nav-link.active {
            background: rgba(255, 255, 255, 0.2);
            color: white !important;
        }
        .btn-custom {
            border-radius: 20px;
            margin: 2px;
        }
        .command-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar">
                <div class="text-center mb-4">
                    <i class="fas fa-robot fa-2x text-white"></i>
                    <h5 class="text-white mt-2">Bot Manager</h5>
                </div>
                <nav class="nav flex-column">
                    <a class="nav-link active" href="#" onclick="showSection('bots')">
                        <i class="fas fa-robot me-2"></i>My Bots
                    </a>
                    <a class="nav-link" href="#" onclick="showSection('commands')">
                        <i class="fas fa-terminal me-2"></i>Commands
                    </a>
                    <a class="nav-link" href="#" onclick="showSection('settings')">
                        <i class="fas fa-cog me-2"></i>Settings
                    </a>
                    <a class="nav-link" href="#" onclick="logout()">
                        <i class="fas fa-sign-out-alt me-2"></i>Logout
                    </a>
                </nav>
            </div>
            
            <!-- Main Content -->
            <div class="col-md-10 main-content">
                <!-- Header -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="text-white">Welcome, <span id="username"></span></h2>
                    <div>
                        <button class="btn btn-success me-2" onclick="startAllBots()">
                            <i class="fas fa-play me-2"></i>Start All Bots
                        </button>
                        <button class="btn btn-warning me-2" onclick="stopAllBots()">
                            <i class="fas fa-stop me-2"></i>Stop All Bots
                        </button>
                        <button class="btn btn-primary" onclick="showCreateBotModal()">
                            <i class="fas fa-plus me-2"></i>Add New Bot
                        </button>
                    </div>
                </div>
                
                <!-- Bots Section -->
                <div id="botsSection">
                    <div class="row" id="botsContainer">
                        <!-- Bots will be loaded here -->
                    </div>
                </div>
                
                <!-- Commands Section -->
                <div id="commandsSection" style="display: none;">
                    <div class="card">
                        <div class="card-header">
                            <h4 class="text-white mb-0">Available Commands</h4>
                        </div>
                        <div class="card-body" id="commandsContainer">
                            <!-- Commands will be loaded here -->
                        </div>
                    </div>
                </div>
                
                <!-- Settings Section -->
                <div id="settingsSection" style="display: none;">
                    <div class="card">
                        <div class="card-header">
                            <h4 class="text-white mb-0">Account Settings</h4>
                        </div>
                        <div class="card-body">
                            <div class="text-white">
                                <p><strong>Username:</strong> <span id="settingsUsername"></span></p>
                                <p><strong>Email:</strong> <span id="settingsEmail"></span></p>
                                <p><strong>Total Bots:</strong> <span id="totalBots">0</span></p>
                                <p><strong>Running Bots:</strong> <span id="runningBots">0</span></p>
                            </div>
                            <hr class="bg-white">
                            <button class="btn btn-primary" onclick="showChangePasswordModal()">
                                <i class="fas fa-key me-2"></i>Change Password
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Bot Modal -->
    <div class="modal fade" id="createBotModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content" style="background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2);">
                <div class="modal-header border-0">
                    <h5 class="modal-title text-white">Create New Bot</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createBotForm" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label text-white">Bot Name</label>
                            <input type="text" class="form-control" name="botName" required style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: white;">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white">Prefix</label>
                            <input type="text" class="form-control" name="prefix" required style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: white;">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white">Admin ID</label>
                            <input type="text" class="form-control" name="adminId" required style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: white;">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white">Bot ID</label>
                            <input type="text" class="form-control" name="botId" required style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: white;">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white">Appstate File</label>
                            <input type="file" class="form-control" name="appstate" accept=".json" required style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: white;">
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" onclick="createBot()">Create Bot</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Bot Modal -->
    <div class="modal fade" id="editBotModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content" style="background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2);">
                <div class="modal-header border-0">
                    <h5 class="modal-title text-white">Edit Bot</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editBotForm">
                        <input type="hidden" id="editBotId">
                        <div class="mb-3">
                            <label class="form-label text-white">Prefix</label>
                            <input type="text" class="form-control" id="editPrefix" required style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: white;">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white">Admin ID</label>
                            <input type="text" class="form-control" id="editAdminId" required style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: white;">
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="updateBot()">Update Bot</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Change Password Modal -->
    <div class="modal fade" id="changePasswordModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content" style="background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2);">
                <div class="modal-header border-0">
                    <h5 class="modal-title text-white">Change Password</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="changePasswordForm">
                        <div class="mb-3">
                            <label class="form-label text-white">Current Password</label>
                            <input type="password" class="form-control" id="currentPassword" required style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: white;">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white">New Password</label>
                            <input type="password" class="form-control" id="newPassword" required style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: white;">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white">Confirm New Password</label>
                            <input type="password" class="form-control" id="confirmNewPassword" required style="background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: white;">
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="changePassword()">Change Password</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentUser = null;
        let userBots = [];
        let commands = [];

        // Load user data and bots on page load
        document.addEventListener('DOMContentLoaded', async () => {
            await loadUserData();
            await loadCommands();
            showSection('bots');
        });

        async function loadUserData() {
            try {
                const response = await fetch('/api/user');
                const result = await response.json();
                
                if (result.success) {
                    currentUser = result.user;
                    userBots = result.user.bots || [];
                    document.getElementById('username').textContent = currentUser.username;
                    document.getElementById('settingsUsername').textContent = currentUser.username;
                    document.getElementById('settingsEmail').textContent = currentUser.email;
                    loadBots();
                    updateStats();
                } else {
                    window.location.href = '/login';
                }
            } catch (error) {
                console.error('Error loading user data:', error);
                window.location.href = '/login';
            }
        }

        async function loadCommands() {
            try {
                const response = await fetch('/api/commands');
                const result = await response.json();
                
                if (result.success) {
                    commands = result.commands;
                }
            } catch (error) {
                console.error('Error loading commands:', error);
            }
        }

        function loadBots() {
            const container = document.getElementById('botsContainer');
            container.innerHTML = '';
            
            if (userBots.length === 0) {
                container.innerHTML = `
                    <div class="col-12">
                        <div class="card text-center">
                            <div class="card-body">
                                <i class="fas fa-robot fa-3x text-white-50 mb-3"></i>
                                <h5 class="text-white">No bots yet</h5>
                                <p class="text-white-50">Create your first bot to get started!</p>
                                <button class="btn btn-success" onclick="showCreateBotModal()">
                                    <i class="fas fa-plus me-2"></i>Add New Bot
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }
            
            userBots.forEach(bot => {
                const statusClass = bot.status === 'running' ? 'status-running' : 
                                  bot.status === 'error' ? 'status-error' : 'status-stopped';
                const statusIcon = bot.status === 'running' ? 'play-circle' : 
                                 bot.status === 'error' ? 'exclamation-triangle' : 'stop-circle';
                
                container.innerHTML += `
                    <div class="col-md-6 col-lg-4">
                        <div class="card bot-card">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start mb-3">
                                    <h5 class="card-title text-white">${bot.name}</h5>
                                    <i class="fas fa-${statusIcon} ${statusClass}"></i>
                                </div>
                                <p class="text-white-50 mb-2"><strong>Prefix:</strong> ${bot.prefix}</p>
                                <p class="text-white-50 mb-2"><strong>Admin ID:</strong> ${bot.adminId}</p>
                                <p class="text-white-50 mb-2"><strong>Bot ID:</strong> ${bot.botId}</p>
                                <p class="text-white-50 mb-2"><strong>Status:</strong> <span class="${statusClass}">${bot.status}</span></p>
                                ${bot.pid ? `<p class="text-white-50 mb-3"><small>PID: ${bot.pid}</small></p>` : ''}
                                
                                <div class="btn-group w-100 mb-2" role="group">
                                    ${bot.status === 'running' ? 
                                        `<button class="btn btn-danger btn-sm" onclick="stopBot('${bot.id}')">
                                            <i class="fas fa-stop"></i>
                                        </button>` :
                                        `<button class="btn btn-success btn-sm" onclick="startBot('${bot.id}')">
                                            <i class="fas fa-play"></i>
                                        </button>`
                                    }
                                    <button class="btn btn-primary btn-sm" onclick="editBot('${bot.id}')">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn btn-danger btn-sm" onclick="deleteBot('${bot.id}')">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                                <small class="text-white-50">Created: ${new Date(bot.createdAt).toLocaleDateString()}</small>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function showCommands() {
            const container = document.getElementById('commandsContainer');
            container.innerHTML = '';
            
            const categories = [...new Set(commands.map(cmd => cmd.category))];
            
            categories.forEach(category => {
                const categoryCommands = commands.filter(cmd => cmd.category === category);
                
                container.innerHTML += `
                    <h5 class="text-white mb-3 mt-4">${category}</h5>
                    <div class="row">
                        ${categoryCommands.map(cmd => `
                            <div class="col-md-6">
                                <div class="command-card">
                                    <h6 class="text-white">${cmd.name}</h6>
                                    <p class="text-white-50 mb-2">${cmd.description}</p>
                                    <small class="text-white-50">
                                        <i class="fas fa-clock me-1"></i>Cooldown: ${cmd.cooldown}s
                                        <i class="fas fa-shield-alt ms-2 me-1"></i>Level: ${cmd.permissions}
                                    </small>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            });
        }

        function updateStats() {
            document.getElementById('totalBots').textContent = userBots.length;
            document.getElementById('runningBots').textContent = userBots.filter(bot => bot.status === 'running').length;
        }

        function showSection(section) {
            // Hide all sections
            document.getElementById('botsSection').style.display = 'none';
            document.getElementById('commandsSection').style.display = 'none';
            document.getElementById('settingsSection').style.display = 'none';
            
            // Remove active class from all nav links
            document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
            
            // Show selected section and mark nav as active
            if (section === 'bots') {
                document.getElementById('botsSection').style.display = 'block';
                document.querySelector('[onclick="showSection(\'bots\')"]').classList.add('active');
            } else if (section === 'commands') {
                document.getElementById('commandsSection').style.display = 'block';
                document.querySelector('[onclick="showSection(\'commands\')"]').classList.add('active');
                showCommands();
            } else if (section === 'settings') {
                document.getElementById('settingsSection').style.display = 'block';
                document.querySelector('[onclick="showSection(\'settings\')"]').classList.add('active');
            }
        }

        function showCreateBotModal() {
            new bootstrap.Modal(document.getElementById('createBotModal')).show();
        }

        async function createBot() {
            const form = document.getElementById('createBotForm');
            const formData = new FormData(form);
            
            try {
                const response = await fetch('/api/bot/create', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    bootstrap.Modal.getInstance(document.getElementById('createBotModal')).hide();
                    form.reset();
                    await loadUserData();
                    alert('Bot created successfully!');
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                alert('An error occurred while creating the bot.');
            }
        }

        async function startBot(botId) {
            try {
                const response = await fetch(`/api/bot/start/${botId}`, {
                    method: 'POST'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    await loadUserData();
                    alert('Bot started successfully!');
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                alert('An error occurred while starting the bot.');
            }
        }

        async function stopBot(botId) {
            try {
                const response = await fetch(`/api/bot/stop/${botId}`, {
                    method: 'POST'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    await loadUserData();
                    alert('Bot stopped successfully!');
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                alert('An error occurred while stopping the bot.');
            }
        }

        function editBot(botId) {
            const bot = userBots.find(b => b.id === botId);
            if (bot) {
                document.getElementById('editBotId').value = bot.id;
                document.getElementById('editPrefix').value = bot.prefix;
                document.getElementById('editAdminId').value = bot.adminId;
                new bootstrap.Modal(document.getElementById('editBotModal')).show();
            }
        }

        async function updateBot() {
            const botId = document.getElementById('editBotId').value;
            const prefix = document.getElementById('editPrefix').value;
            const adminId = document.getElementById('editAdminId').value;
            
            try {
                const response = await fetch(`/api/bot/update/${botId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ prefix, adminId })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    bootstrap.Modal.getInstance(document.getElementById('editBotModal')).hide();
                    await loadUserData();
                    alert('Bot updated successfully!');
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                alert('An error occurred while updating the bot.');
            }
        }

        async function deleteBot(botId) {
            if (confirm('Are you sure you want to delete this bot? This action cannot be undone.')) {
                try {
                    const response = await fetch(`/api/bot/delete/${botId}`, {
                        method: 'DELETE'
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        await loadUserData();
                        alert('Bot deleted successfully!');
                    } else {
                        alert('Error: ' + result.message);
                    }
                } catch (error) {
                    alert('An error occurred while deleting the bot.');
                }
            }
        }

        async function startAllBots() {
            if (confirm('Are you sure you want to start all bots?')) {
                try {
                    const response = await fetch('/api/bot/start-all', {
                        method: 'POST'
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        await loadUserData();
                        alert(result.message + (result.errors ? '\n\nErrors:\n' + result.errors.join('\n') : ''));
                    } else {
                        alert('Error: ' + result.message);
                    }
                } catch (error) {
                    alert('An error occurred while starting all bots.');
                }
            }
        }

        async function stopAllBots() {
            if (confirm('Are you sure you want to stop all running bots?')) {
                try {
                    const response = await fetch('/api/bot/stop-all', {
                        method: 'POST'
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        await loadUserData();
                        alert(result.message);
                    } else {
                        alert('Error: ' + result.message);
                    }
                } catch (error) {
                    alert('An error occurred while stopping all bots.');
                }
            }
        }

        function showChangePasswordModal() {
            new bootstrap.Modal(document.getElementById('changePasswordModal')).show();
        }

        async function changePassword() {
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;
            
            if (newPassword !== confirmNewPassword) {
                alert('New passwords do not match!');
                return;
            }
            
            if (newPassword.length < 6) {
                alert('New password must be at least 6 characters long!');
                return;
            }
            
            try {
                const response = await fetch('/api/change-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ currentPassword, newPassword })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    bootstrap.Modal.getInstance(document.getElementById('changePasswordModal')).hide();
                    document.getElementById('changePasswordForm').reset();
                    alert('Password changed successfully!');
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                alert('An error occurred while changing password.');
            }
        }

        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
                window.location.href = '/login';
            } catch (error) {
                window.location.href = '/login';
            }
        }
    </script>
</body>
</html>
